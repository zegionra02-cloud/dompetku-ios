name: Build DompetKu iOS (.ipa)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Generate iOS Project
        run: |
          npm install
          npx cap add ios
          node scripts/patch-ios-plist.js
          npx @capacitor/assets generate --ios
          npx cap sync ios

      - name: Build Unsigned .app via Xcode
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r DompetKu-iOS.ipa Payload

      - name: Upload File .ipa Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: DompetKu-iOS-IPA
          path: DompetKu-iOS.ipa
